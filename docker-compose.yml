services:
  # 9router Core (decolua/9router — Next.js AI manager dashboard)
  # Migrated from standalone `docker run 9router`; volume maps ./data/core (host)
  # to /app/data — the SAME host dir the standalone container uses, so data
  # persists across the migration. Bridge net + 127.0.0.1 publish = exact parity.
  core:
    image: decolua/9router:latest
    container_name: 9router
    restart: unless-stopped
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - BASE_URL=${BASE_URL}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - ENABLE_TRANSLATOR=${ENABLE_TRANSLATOR:-false}
    volumes:
      - ./data/core:/app/data

  # 9router Gateway (Go reverse-proxy middleware in front of 9router Core)
  # NOTE: runs on host network to reach core at 127.0.0.1:20128; core db is
  # backfilled from the compose-managed core service above.
  gateway:
    build: .
    container_name: 9router_gateway
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=20129
      - HOST=0.0.0.0
      - UPSTREAM_URL=http://127.0.0.1:20128
      - DB_PATH=/app/data/gateway.db
      - NINEROUTER_DB_PATH=/app/data/core/db/data.sqlite
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - core