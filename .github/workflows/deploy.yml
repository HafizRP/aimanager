name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: /home/b14/aimanager
    steps:
      - name: Sync server checkout to this commit
        run: |
          set -euo pipefail
          echo "→ Syncing /home/b14/aimanager to $GITHUB_SHA..."
          git fetch origin
          git reset --hard "$GITHUB_SHA"
          git status --short | head -5 || true

      - name: Build & deploy (docker compose)
        run: |
          set -euo pipefail
          echo "→ Building gateway image..."
          docker compose build gateway
          echo "→ Starting core + gateway..."
          docker compose up -d
          sleep 5

      - name: Verify
        run: |
          set -euo pipefail
          echo "→ Verifying..."
          docker compose ps --format "{{.Name}} {{.Status}}" | tee /tmp/compose-ps.txt
          grep -q "^9router_gateway Up" /tmp/compose-ps.txt
          grep -q "^9router Up" /tmp/compose-ps.txt
          curl -sf http://127.0.0.1:20129/healthz && echo " gateway healthz OK"
          curl -sf -o /dev/null -w "core: %{http_code}\n" --max-time 8 http://127.0.0.1:20128/ || true
          docker logs 9router_gateway --since 2m 2>&1 | grep -iE "WRN|ERR" | grep -v "9router route" || echo " no warnings/errors"
          echo "✅ Deploy complete"

      - name: Notify Telegram (success)
        if: success()
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "Telegram notification skipped (TG_BOT_TOKEN or TG_CHAT_ID not set)"
            exit 0
          fi
          SHA_SHORT="${GITHUB_SHA:0:7}"
          printf -v MSG '✅ <b>Deploy sukses</b> — <code>aimanager</code>\n• Branch: <code>%s</code>\n• Commit: <code>%s</code> — <code>%s</code>\n• Event: <code>%s</code>\n• Run: <a href="%s">#%s</a>\n• Service: aktif &amp; healthz OK' "$GITHUB_REF_NAME" "$SHA_SHORT" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "$GITHUB_RUN_NUMBER"
          
          CHAT_ID="${TG_CHAT_ID%%:*}"
          THREAD_ARGS=()
          if [[ "${TG_CHAT_ID}" == *":"* ]]; then
            THREAD_ID="${TG_CHAT_ID##*:}"
            if [ -n "${THREAD_ID}" ] && [ "${THREAD_ID}" != "${CHAT_ID}" ]; then
              THREAD_ARGS=(--data-urlencode "message_thread_id=${THREAD_ID}")
            fi
          fi

          echo "→ Sending Telegram success notification..."
          RES=$(curl -s -S -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            "${THREAD_ARGS[@]}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode=HTML || true)

          if echo "$RES" | grep -q '"ok":true'; then
            echo "✅ Telegram notification sent successfully."
          else
            echo "::warning::Telegram notification response: $RES"
          fi

      - name: Notify Telegram (failure)
        if: failure()
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "Telegram notification skipped (TG_BOT_TOKEN or TG_CHAT_ID not set)"
            exit 0
          fi
          SHA_SHORT="${GITHUB_SHA:0:7}"
          printf -v MSG '❌ <b>Deploy GAGAL</b> — <code>aimanager</code>\n• Branch: <code>%s</code>\n• Commit: <code>%s</code> — <code>%s</code>\n• Event: <code>%s</code>\n• Run: <a href="%s">#%s</a>\n• Detail: <a href="%s">lihat logs</a>' "$GITHUB_REF_NAME" "$SHA_SHORT" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "$GITHUB_RUN_NUMBER" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          
          CHAT_ID="${TG_CHAT_ID%%:*}"
          THREAD_ARGS=()
          if [[ "${TG_CHAT_ID}" == *":"* ]]; then
            THREAD_ID="${TG_CHAT_ID##*:}"
            if [ -n "${THREAD_ID}" ] && [ "${THREAD_ID}" != "${CHAT_ID}" ]; then
              THREAD_ARGS=(--data-urlencode "message_thread_id=${THREAD_ID}")
            fi
          fi

          echo "→ Sending Telegram failure notification..."
          RES=$(curl -s -S -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            "${THREAD_ARGS[@]}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode=HTML || true)

          if echo "$RES" | grep -q '"ok":true'; then
            echo "✅ Telegram failure notification sent."
          else
            echo "::warning::Telegram notification response: $RES"
          fi
