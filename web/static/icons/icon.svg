<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Deep OLED Slate/Zinc (#07080c to #111522) -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141a2b" />
      <stop offset="50%" stop-color="#090c14" />
      <stop offset="100%" stop-color="#050609" />
    </radialGradient>

    <!-- Outer Ambient Aura for the Chip -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Chip Body Gradient (Brushed Dark Titanium Glass) -->
    <linearGradient id="chipBodyGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#1e2538" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0b0d16" />
    </linearGradient>

    <!-- Glowing Chip Perimeter Border -->
    <linearGradient id="chipBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Connector Pin Gradients (Metallic Gold-Cyan Sheen) -->
    <linearGradient id="pinVGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="pinHGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Core Radiant Gradient -->
    <linearGradient id="corePlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Filters for Depth and Glow -->
    <filter id="shadowChip" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Full-bleed background canvas (100% solid & seamless) -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- 2. Ambient Aura Glow behind chip (Radius 160px) -->
  <circle cx="256" cy="256" r="160" fill="url(#auraGlow)" />

  <!-- 3. Hardware Bus Pins (Tucked tight within Safe Zone: span 124 to 388) -->
  <!-- Top Pins -->
  <g fill="url(#pinVGrad)">
    <rect x="210" y="124" width="20" height="32" rx="6" />
    <rect x="246" y="118" width="20" height="38" rx="6" />
    <rect x="282" y="124" width="20" height="32" rx="6" />
  </g>
  <!-- Bottom Pins -->
  <g fill="url(#pinVGrad)">
    <rect x="210" y="356" width="20" height="32" rx="6" />
    <rect x="246" y="356" width="20" height="38" rx="6" />
    <rect x="282" y="356" width="20" height="32" rx="6" />
  </g>
  <!-- Left Pins -->
  <g fill="url(#pinHGrad)">
    <rect x="124" y="210" width="32" height="20" rx="6" />
    <rect x="118" y="246" width="38" height="20" rx="6" />
    <rect x="124" y="282" width="32" height="20" rx="6" />
  </g>
  <!-- Right Pins -->
  <g fill="url(#pinHGrad)">
    <rect x="356" y="210" width="32" height="20" rx="6" />
    <rect x="356" y="246" width="38" height="20" rx="6" />
    <rect x="356" y="282" width="32" height="20" rx="6" />
  </g>

  <!-- 4. Chip Outer Glowing Rim -->
  <rect x="146" y="146" width="220" height="220" rx="42" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.25" filter="url(#coreGlow)" />

  <!-- 5. Main Processor Die with Crisp Drop Shadow -->
  <g filter="url(#shadowChip)">
    <rect x="148" y="148" width="216" height="216" rx="40" fill="url(#chipBodyGrad)" stroke="url(#chipBorderGrad)" stroke-width="3" />
  </g>

  <!-- Top Specular Highlight Edge -->
  <path d="M 180 151 L 332 151" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <!-- Corner Precision Micro-Nodes (Enlarged for clear visibility) -->
  <g fill="#38bdf8">
    <circle cx="174" cy="174" r="6" />
    <circle cx="338" cy="174" r="6" />
    <circle cx="174" cy="338" r="6" />
    <circle cx="338" cy="338" r="6" />
  </g>
  <g fill="#ffffff">
    <circle cx="174" cy="174" r="2.5" />
    <circle cx="338" cy="174" r="2.5" />
    <circle cx="174" cy="338" r="2.5" />
    <circle cx="338" cy="338" r="2.5" />
  </g>

  <!-- 6. Bold Inner Neural Core / AI Engine -->
  <!-- Inner Die Plate (Recessed dark bezel) -->
  <rect x="188" y="188" width="136" height="136" rx="26" fill="#0c101a" stroke="url(#chipBorderGrad)" stroke-width="2" />

  <!-- Bold Connecting Data Traces (7px wide, ultra legible at 32px-48px) -->
  <g stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.95">
    <line x1="256" y1="166" x2="256" y2="188" />
    <line x1="256" y1="324" x2="256" y2="346" />
    <line x1="166" y1="256" x2="188" y2="256" />
    <line x1="324" y1="256" x2="346" y2="256" />
  </g>
  <!-- Gateway Endpoints (Enlarged) -->
  <g fill="#38bdf8">
    <circle cx="256" cy="166" r="7" />
    <circle cx="256" cy="346" r="7" />
    <circle cx="166" cy="256" r="7" />
    <circle cx="346" cy="256" r="7" />
  </g>
  <g fill="#ffffff">
    <circle cx="256" cy="166" r="3.5" />
    <circle cx="256" cy="346" r="3.5" />
    <circle cx="166" cy="256" r="3.5" />
    <circle cx="346" cy="256" r="3.5" />
  </g>

  <!-- Central Luminous Core (Glowing AI Diamond + Stylized "AI" Emblem) -->
  <g filter="url(#coreGlow)">
    <!-- Glowing Diamond Backing -->
    <rect x="220" y="220" width="72" height="72" rx="18" transform="rotate(45 256 256)" fill="url(#corePlateGrad)" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Stylized Geometric "AI" Monogram on Core (Extra bold for maximum readability) -->
  <!-- "A" Glyph -->
  <path d="M 233 271 L 243 241 L 253 271 M 236 263 L 250 263" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- "I" Glyph (Pill style) -->
  <line x1="269" y1="241" x2="269" y2="271" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <!-- Accent dot above "I" -->
  <circle cx="269" cy="233" r="3" fill="#ffffff" />
</svg>
