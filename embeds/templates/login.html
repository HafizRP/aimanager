<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - 9router Gateway</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; position: relative; overflow: hidden;">
  <!-- Ambient background glow -->
  <div style="position: absolute; width: 450px; height: 450px; background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(168, 85, 247, 0.05) 50%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 0;"></div>

  <div class="card-modern p-4 p-md-5" style="max-width: 420px; width: 100%; position: relative; z-index: 1; backdrop-filter: blur(20px);">
    <div class="text-center mb-4">
      <div class="brand-glow mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem; border-radius: 14px;">
        <i class="bi bi-cpu-fill"></i>
      </div>
      <h4 class="fw-bold mb-1 text-light tracking-tight">9router Gateway</h4>
      <p class="text-dim small mb-0">Reverse Proxy & API Middleware Manager</p>
    </div>

    {{ if .ErrorMsg }}
      <div class="alert card-modern border-danger border-opacity-50 py-2 px-3 small d-flex align-items-center gap-2 mb-3 text-light">
        <i class="bi bi-exclamation-circle-fill text-danger"></i> {{ .ErrorMsg }}
      </div>
    {{ end }}

    <form method="POST" action="/login">
      <div class="mb-3">
        <label class="form-label small text-muted">Admin Username</label>
        <div class="input-group">
          <span class="input-group-text form-control-modern border-end-0 text-dim"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control form-control-modern border-start-0" placeholder="admin" required autofocus value="admin">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small text-muted">Admin Password</label>
        <div class="input-group">
          <span class="input-group-text form-control-modern border-end-0 text-dim"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control form-control-modern border-start-0" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-modern-primary w-100 py-2 d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-10">
      <div class="status-pill-live">
        <span class="pulse-dot"></span>
        <span>Gateway Port :20129</span>
      </div>
    </div>
  </div>
</body>
</html>
