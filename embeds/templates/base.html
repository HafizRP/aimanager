<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block "title" . }}9router Gateway{{ end }}</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body>
  <!-- Navigation Header -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
        <div class="stat-icon-wrapper bg-primary bg-opacity-25 text-primary" style="width:36px;height:36px;font-size:1.1rem;">
          <i class="bi bi-hdd-network-fill"></i>
        </div>
        <span>9router <span class="badge bg-primary-subtle text-primary border border-primary-subtle">Gateway</span></span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-1">
          <li class="nav-item">
            <a class="nav-link {{ if eq .ActivePage "dashboard" }}active{{ end }}" href="/">
              <i class="bi bi-speedometer2 me-1"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {{ if eq .ActivePage "users" }}active{{ end }}" href="/users">
              <i class="bi bi-people me-1"></i> Users & Quotas
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {{ if eq .ActivePage "keys" }}active{{ end }}" href="/keys">
              <i class="bi bi-key me-1"></i> API Keys
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {{ if eq .ActivePage "logs" }}active{{ end }}" href="/logs">
              <i class="bi bi-activity me-1"></i> Request Logs
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {{ if eq .ActivePage "models" }}active{{ end }}" href="/models">
              <i class="bi bi-cpu me-1"></i> Models
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {{ if eq .ActivePage "settings" }}active{{ end }}" href="/settings">
              <i class="bi bi-sliders me-1"></i> Quick Setup
            </a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <div class="d-none d-md-flex align-items-center gap-2 px-3 py-1 rounded-pill bg-dark border border-secondary border-opacity-50">
            <span class="spinner-grow spinner-grow-sm text-success" style="width: 8px; height: 8px;" role="status"></span>
            <span class="small text-muted">Upstream: <span class="text-light fw-medium">127.0.0.1:20128</span></span>
          </div>

          <form action="/logout" method="POST" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1">
              <i class="bi bi-box-arrow-right"></i> Logout
            </button>
          </form>
        </div>
      </div>
    </div>
  </nav>

  <!-- Flash Messages -->
  <div class="container-fluid px-4 mt-3">
    {{ if .SuccessMsg }}
      <div class="alert alert-success alert-dismissible fade show border border-success border-opacity-25" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> {{ .SuccessMsg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {{ end }}
    {{ if .ErrorMsg }}
      <div class="alert alert-danger alert-dismissible fade show border border-danger border-opacity-25" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ .ErrorMsg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {{ end }}
  </div>

  <!-- Main Body Content -->
  <main class="container-fluid px-4 py-3">
    {{ template "content" . }}
  </main>

  <!-- Bootstrap 5.3 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- App JS -->
  <script src="/static/js/app.js"></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
